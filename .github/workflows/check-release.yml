name: Check for new Bridge release

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare latest upstream release to committed VERSION
        id: check
        run: |
          latest=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ProtonMail/proton-bridge/releases/latest \
            | jq -r '.tag_name')
          current=$(cat VERSION)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then
            echo "$latest" > VERSION
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit VERSION bump
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump Proton Bridge to ${{ steps.check.outputs.latest }}"
          git push
